<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .task-done {
            text-decoration: line-through;
            color: gray;
        }

        .card {
            transition:  0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .btn {
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .list-group-item {
            transition: 0.2s;
        }

        .list-group-item:hover {
            background-color: #eef3ff;
        }

        .overflow-hidden {
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-dark bg-gradient" style="min-height:100vh;">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-4 shadow">
        <span class="navbar-brand fw-bold">📋 To Do App</span>

        <div class="input-group w-auto">
            <span class="input-group-text">🔍</span>
            <input type="text" id="searchInput" class="form-control" placeholder="Search..." onkeyup="searchCards()">
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container mt-4">
        <h2 class="text-center text-white fw-bold mb-4">My To-Do's🚀</h2>

        <!-- Add Card -->
        <div class="input-group mb-3 shadow-sm">
            <input type="text" id="cardTitle" class="form-control" placeholder="Enter To-Do title">
            <button class="btn btn-success" onclick="addCard()">Add</button>
        </div>

        <!-- Error -->
        <p id="errorMsg" class="text-danger text-center"></p>

        <!-- Cards -->
        <div id="cardContainer" class="row g-3"></div>
    </div>

    <!-- TOAST -->
    <div class="toast position-fixed bottom-0 end-0 p-3" style="z-index: 9999;" id="confirmToast">
        <div class="toast-body bg-warning text-dark rounded shadow">
            <div class="mb-2">Are you sure to delete this card?</div>

            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-sm btn-secondary" id="cancelDeleteBtn">No</button>
                <button class="btn btn-sm btn-danger" id="confirmDeleteBtn">Yes</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let cards = JSON.parse(localStorage.getItem("cards")) || [];
        let deleteIndex = null;

        function save() {
            localStorage.setItem("cards", JSON.stringify(cards));
        }

        // ✅ Add Card
        function addCard() {
            const input = document.getElementById("cardTitle");
            const error = document.getElementById("errorMsg");
            const title = input.value.trim();

            if (!title) return;

            const exists = cards.some(c=>c.title.toLowerCase() === title.toLowerCase());

            if (exists) {
                error.innerText = "❌ Card already exists!";
                return;
            }

            error.innerText = "";
            cards.push({ title, tasks: [] });

            input.value = "";
            save();
            render();
        }

        // ✅ Add Task
        function addTask(cIndex) {
            const input = document.getElementById(`taskInput-${cIndex}`);
            const text = input.value.trim();

            if (!text) return;

            cards[cIndex].tasks.push({ text, done: false });

            input.value = "";
            save();
            render();
        }

        function toggleTask(cIndex, tIndex) {
            cards[cIndex].tasks[tIndex].done = !cards[cIndex].tasks[tIndex].done;
            save();
            render();
        }

        function deleteTask(cIndex, tIndex) {
            cards[cIndex].tasks.splice(tIndex, 1);
            save();
            render();
        }

        // ✅ Delete Card (Toast)
        function deleteCard(cIndex) {
            deleteIndex = cIndex;
            toastInstance.show();
        }

        const toastInstance = new bootstrap.Toast(document.getElementById("confirmToast"));

        document.getElementById("confirmDeleteBtn").onclick = function () {
            if (deleteIndex !== null) {
                cards.splice(deleteIndex, 1);
                deleteIndex = null;
                save();
                render();
            }
            toastInstance.hide();
        };

        document.getElementById("cancelDeleteBtn").onclick = function () {
            deleteIndex = null;
            toastInstance.hide();
        };

        // ✅ Search
        function searchCards() {
            const query = document.getElementById("searchInput").value.toLowerCase();

            const filtered = cards.filter(card =>
                card.title.toLowerCase().includes(query)
            );

            render(filtered);
        }

        // ✅ Render
        function render(data = cards) {
            const container = document.getElementById("cardContainer");
            container.innerHTML = "";

            data.forEach((card) => {
                const realIndex = cards.indexOf(card);

                const col = document.createElement("div");
                col.className = "col-md-4";

                col.innerHTML = `
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
          <div class="card-header d-flex justify-content-between bg-light">
            <strong class="text-truncate" style="max-width: 80%;">${card.title}</strong>
            <button class="btn btn-sm btn-danger" onclick="deleteCard(${realIndex})">X</button>
          </div>

          <div class="card-body">
            <div class="input-group mb-3">
              <input type="text" 
                id="taskInput-${realIndex}" 
                class="form-control" 
                placeholder="Add task"
                onkeypress="if(event.key==='Enter'){event.preventDefault(); addTask(${realIndex})}">
              
              <button class="btn btn-primary" onclick="addTask(${realIndex})">+</button>
            </div>

            <ul class="list-group">
              ${card.tasks.map((task, tIndex) => `
                <li class="list-group-item d-flex justify-content-between align-items-center rounded">
                  <div>
                    <input type="checkbox" ${task.done ? "checked" : ""} 
                      onchange="toggleTask(${realIndex}, ${tIndex})">
                    <span class="${task.done ? 'task-done' : ''} ms-2">
                      ${task.text}
                    </span>
                  </div>
                  <button class="btn btn-sm btn-outline-danger"
                    onclick="deleteTask(${realIndex}, ${tIndex})">
                    Delete
                  </button>
                </li>
              `).join("")}
            </ul>
          </div>
        </div>
      `;
                container.appendChild(col);
            });
        }

        // ✅ Enter for card input
        document.getElementById("cardTitle").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                // e.preventDefault();
                addCard();
            }
        });

        render();
    </script>

</body>

</html>
